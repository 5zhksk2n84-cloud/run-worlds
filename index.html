<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101827"><title>RUN WORLDS</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:white;font-family:system-ui}#app{height:100dvh;max-width:760px;margin:auto;padding:12px;display:flex;flex-direction:column;gap:10px}header,#stats,#controls{display:flex;justify-content:space-between;gap:10px;align-items:center}h1{color:#65e6c2;font-size:25px;margin:0}button{border:0;border-radius:12px;padding:12px;background:#263b55;color:white;font-weight:bold}canvas{width:100%;flex:1;min-height:250px;border-radius:18px;touch-action:none;background:#18344b}#controls button{background:#1fbd98;color:#06251f}#menu{position:absolute;inset:0;background:#101827ee;display:grid;place-items:center;padding:20px}.panel{max-width:440px;background:#1b2a40;border:1px solid #38516d;border-radius:20px;padding:22px;text-align:center}.panel h2{color:#65e6c2}.choices{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px}.primary{background:#1fbd98;color:#06251f;width:100%}.muted{color:#b8c9df;font-size:14px}</style></head><body><div id="app"><header><h1>RUN WORLDS</h1><button id="pause">Ⅱ</button></header><div id="stats">⭐ <b id="score">0</b>　🪙 <b id="coins">0</b>　🏆 <b id="best">0</b></div><canvas id="game" width="720" height="900"></canvas><div id="controls"><button data-a="left">◀</button><button data-a="jump">⬆ Прыжок</button><button data-a="slide">⬇</button><button data-a="right">▶</button></div><p class="muted" style="text-align:center">Свайпай по экрану или нажимай кнопки</p></div><div id="menu"><div class="panel"><h2>RUN WORLDS</h2><p id="msg">Выбери мир и персонажа!</p><div class="choices"><button data-w="metro">🚇 Метро</button><button data-w="forest">🌲 Лес</button><button data-w="future">🌃 Неон</button></div><div class="choices"><button data-s="🧑‍🚀">🧑‍🚀</button><button data-s="🦊">🦊</button><button data-s="🐼">🐼</button><button data-s="🤖">🤖</button><button data-s="🐸">🐸</button></div><button class="primary" id="start">ИГРАТЬ</button></div></div><script>(()=>{const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}const c=document.querySelector('canvas'),x=c.getContext('2d'),$=id=>document.getElementById(id);let lane=1,world='metro',skin='🧑‍🚀',score=0,coins=0,best=+(localStorage.rwBest||0),items=[],run=false,paused=false,t=0,jump=0,v=0;const palette={metro:['#152c48','#557b91'],forest:['#123b32','#5d9c54'],future:['#251c50','#8c4ce0']};$('best').textContent=best;function draw(){let g=x.createLinearGradient(0,0,0,900);g.addColorStop(0,palette[world][0]);g.addColorStop(1,palette[world][1]);x.fillStyle=g;x.fillRect(0,0,720,900);x.fillStyle='#111c2b';x.beginPath();x.moveTo(205,220);x.lineTo(515,220);x.lineTo(710,900);x.lineTo(10,900);x.fill();x.strokeStyle='#d5e8e8';x.lineWidth=5;[310,410].forEach(a=>{x.beginPath();x.moveTo(360+(a-360)*.08,220);x.lineTo(a*1.8-288,900);x.stroke()});items.forEach(o=>{let px=360+(o.lane-1)*(o.y*.37+40);x.font='bold 55px system-ui';x.textAlign='center';x.fillText(o.coin?'🪙':'🚧',px,o.y)});x.font='70px system-ui';x.textAlign='center';x.fillText(skin,360+(lane-1)*115,760-jump);x.fillStyle='white';x.font='22px system-ui';x.fillText(world.toUpperCase(),360,55)}function finish(){run=false;best=Math.max(best,score);localStorage.rwBest=best;$('best').textContent=best;$('msg').textContent='Финиш! Очки: '+score+' · Монеты: '+coins;$('start').textContent='ЕЩЁ РАЗ';$('menu').style.display='grid'}function tick(){if(!run||paused)return;t++;score++;if(t%38===0)items.push({lane:Math.floor(Math.random()*3),y:130,coin:Math.random()<.5,hit:false});items.forEach(o=>{o.y+=6;if(o.y>675&&o.y<780&&!o.hit&&o.lane===lane){o.hit=true;if(o.coin){coins++;$('coins').textContent=coins}else if(jump<45)finish()}});items=items.filter(o=>o.y<950);jump+=v;v-=1.1;if(jump<0){jump=0;v=0} $('score').textContent=score;draw();if(run)requestAnimationFrame(tick)}function act(a){if(!run)return;if(a==='left')lane=Math.max(0,lane-1);if(a==='right')lane=Math.min(2,lane+1);if(a==='jump'&&jump===0)v=18;if(a==='slide')jump=0}document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a));document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{world=b.dataset.w;draw()});document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{skin=b.dataset.s;draw()});$('start').onclick=()=>{score=0;coins=0;lane=1;jump=0;v=0;t=0;items=[];run=true;paused=false;$('score').textContent='0';$('coins').textContent='0';$('menu').style.display='none';requestAnimationFrame(tick)};$('pause').onclick=()=>{if(run){paused=!paused;if(!paused)requestAnimationFrame(tick)}};let sx=0,sy=0;c.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};c.ontouchend=e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;act(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy<0?'jump':'slide'))};onkeydown=e=>{if(e.key==='ArrowLeft')act('left');if(e.key==='ArrowRight')act('right');if(e.key==='ArrowUp'||e.key===' ')act('jump');if(e.key==='ArrowDown')act('slide')};draw()})();</script></body></html>
